name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laverdu
          POSTGRES_PASSWORD: laverdu_ci_only
          POSTGRES_DB: laverdu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laverdu -d laverdu_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://laverdu:laverdu_ci_only@localhost:5432/laverdu_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration -w @la-verdu/api

      - name: Dependency audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
