  .wrap{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:400px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.6);border-radius:16px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,0.35)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .mark{width:40px;height:40px;border-radius:10px;background:var(--brand-600);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
  .title{font-size:22px;font-weight:700;color:var(--slate-900)}
  .sub{color:var(--slate-500);font-size:14px;margin-bottom:24px}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--slate-700)}
  input{width:100%;border:1px solid var(--slate-300);border-radius:8px;padding:10px 12px;font-size:14px;background:#fff}
  input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(16,185,129,0.18)}
  .field{margin-bottom:14px}
  .btn{width:100%;background:var(--brand-600);color:#fff;border:none;border-radius:8px;padding:11px;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px}
  .btn:hover{background:var(--brand-700)}
  .foot{text-align:center;margin-top:20px;font-size:12px;color:var(--slate-500)}
  .foot strong{color:var(--brand-700)}
  /* biome-ignore lint/complexity/noImportantStyles: reduced-motion override must win the cascade */
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="wrap">
    <div class="card">
      <div class="brand"><svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tomate"><path d="M16 6 C 14 3, 10 3, 9 6 C 8 8, 10 9, 12 8 C 13 7, 14 7, 16 6 Z" fill="#059669"/><path d="M16 6 C 18 3, 22 3, 23 6 C 24 8, 22 9, 20 8 C 19 7, 18 7, 16 6 Z" fill="#047857"/><path d="M16 6 C 15 4, 16 2, 17 3 C 18 4, 17 6, 16 6 Z" fill="#10b981"/><rect x="15" y="5" width="2" height="3" rx="1" fill="#064e3b"/><circle cx="16" cy="19" r="11" fill="#dc2626"/></svg><span class="title">La Verdu · Administración</span></div>
      <p class="sub">Iniciá sesión para continuar</p>
      <div class="field">
        <label for="login-user">Usuario</label>
        <input id="login-user" placeholder="dueño" autocomplete="username" />
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button type="button" class="btn">Ingresar</button>
      <div class="foot">Asistente de WhatsApp para <strong>fruterías y verdulerías</strong></div>
    </div>
  </div>
</body>
