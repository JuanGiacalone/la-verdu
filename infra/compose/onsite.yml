# On-site deployment profile (PRD 13.2, profile A).
# Runs everything locally. Requires a machine with enough RAM for the LLM.
# The LLM and STT servers are separate services that must be configured.
name: la-verdu-onsite

x-node: &node
  image: docker.io/library/node:22-bookworm-slim
  working_dir: /app
  restart: unless-stopped

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: laverdu
      POSTGRES_PASSWORD: CHANGE_ME_IN_PRODUCTION
      POSTGRES_DB: laverdu
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laverdu -d laverdu"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # LLM server (Ollama, llama.cpp, or vLLM). Configure the model separately.
  llm-server:
    image: docker.io/ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # STT server (faster-whisper or whisper.cpp). Configure the model separately.
  stt-server:
    image: docker.io/fedirz/faster-whisper-server:latest
    ports:
      - "127.0.0.1:8083:8000"
    environment:
      WHISPER_MODEL: small
      WHISPER_LANGUAGE: es
    restart: unless-stopped

  api:
    <<: *node
    command:
      - sh
      - -c
      - npm run db:migrate -w @la-verdu/api && npm run start -w @la-verdu/api
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://laverdu:CHANGE_ME_IN_PRODUCTION@db:5432/laverdu
      TZ_APP: America/Argentina/Buenos_Aires
      LOG_LEVEL: info
      CHAT_BASE_URL: http://llm-server:11434/v1
      CHAT_API_KEY: ""
      CHAT_MODEL: llama3.1:8b
      STT_BASE_URL: http://stt-server:8000/v1
      STT_API_KEY: ""
      STT_MODEL: small
      WHATSAPP_APP_SECRET: CHANGE_ME
      WHATSAPP_VERIFY_TOKEN: CHANGE_ME
      WHATSAPP_ACCESS_TOKEN: CHANGE_ME
      WHATSAPP_PHONE_NUMBER_ID: CHANGE_ME
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../:/app

  # Tunnel for WhatsApp webhook (Cloudflare Tunnel or similar).
  # Configure the tunnel token separately.
  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token CHANGE_ME_TUNNEL_TOKEN
    restart: unless-stopped

  print-agent:
    build:
      context: ../../apps/print-agent
      dockerfile: Dockerfile
    environment:
      PRINT_AGENT_CONFIG: /config.json
    volumes:
      - ./print-agent-config.json:/config.json:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  ollama-data:
